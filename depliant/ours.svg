<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <!-- Le plus grand câlin du monde : deux oursons, l'un serrant l'autre -->
  <g stroke="#8d6a4a" stroke-width="2.6" stroke-linejoin="round">
    <!-- Ourson de derrière -->
    <g fill="#c8a079">
      <circle cx="72" cy="40" r="15"/><circle cx="140" cy="38" r="15"/>
      <path d="M40 150 C40 96 66 68 106 68 C146 68 172 96 172 150 Z"/>
      <circle cx="106" cy="56" r="42"/>
    </g>
    <!-- Ourson de devant -->
    <g fill="#e8cba6">
      <circle cx="42" cy="74" r="13"/><circle cx="98" cy="72" r="13"/>
      <path d="M18 152 C18 110 38 88 70 88 C102 88 122 110 122 152 Z"/>
      <circle cx="70" cy="88" r="36"/>
    </g>
    <!-- Les bras qui entourent -->
    <path d="M128 106 C112 132 70 140 40 126" fill="#c8a079"/>
    <path d="M22 118 C44 140 84 142 106 126" fill="#e8cba6"/>
  </g>

  <!-- Les yeux fermés, les museaux, les joues -->
  <g fill="none" stroke="#5f462f" stroke-width="2.6" stroke-linecap="round">
    <path d="M92 50 q6 -6 12 0"/><path d="M118 50 q6 -6 12 0"/>
    <path d="M56 84 q6 -6 12 0"/><path d="M82 84 q6 -6 12 0"/>
  </g>
  <g fill="#f5e6d2" stroke="#8d6a4a" stroke-width="2">
    <ellipse cx="112" cy="68" rx="14" ry="10"/>
    <ellipse cx="76" cy="102" rx="13" ry="9"/>
  </g>
  <g fill="#5f462f">
    <ellipse cx="112" cy="63" rx="4" ry="3"/>
    <ellipse cx="76" cy="97" rx="3.6" ry="2.8"/>
  </g>
  <g fill="none" stroke="#5f462f" stroke-width="1.8" stroke-linecap="round">
    <path d="M112 66 v3 M108 72 q4 3 8 0"/>
    <path d="M76 100 v3 M72.5 105 q3.5 2.6 7 0"/>
  </g>
  <g fill="#f0b6c4" opacity="0.75">
    <ellipse cx="86" cy="62" rx="6" ry="3.6"/><ellipse cx="138" cy="60" rx="6" ry="3.6"/>
    <ellipse cx="48" cy="96" rx="5.6" ry="3.4"/><ellipse cx="102" cy="94" rx="5.6" ry="3.4"/>
  </g>
  <!-- un petit cœur au-dessus -->
  <path d="M100 14 C94 6 82 8 82 18 C82 27 96 34 100 38 C104 34 118 27 118 18 C118 8 106 6 100 14 Z"
        fill="#b478e8" opacity="0.8"/>
</svg>
