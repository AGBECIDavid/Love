<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 180" width="210" height="180">
  <!-- Deux oursons qui se serrent : le gris enlace le brun.
       Dessiné d'après la couverture du livre, au trait souple. -->
  <g stroke="#3a332c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">

    <!-- L'ourson gris -->
    <g fill="#b9b4ad">
      <circle cx="66" cy="34" r="14"/>
      <circle cx="124" cy="30" r="14"/>
      <path d="M42 162 C42 110 62 78 96 78 C130 78 150 110 150 162 C130 168 62 168 42 162 Z"/>
      <ellipse cx="96" cy="56" rx="42" ry="38"/>
    </g>

    <!-- L'ourson brun, blotti contre lui -->
    <g fill="#c0894f">
      <circle cx="56" cy="88" r="12"/>
      <circle cx="106" cy="84" r="12"/>
      <path d="M36 164 C36 124 54 102 81 102 C108 102 126 124 126 164 C106 169 56 169 36 164 Z"/>
      <ellipse cx="81" cy="101" rx="34" ry="31"/>
    </g>
  </g>

  <!-- Les bras : un trait épais, cerné — comme au crayon -->
  <g fill="none" stroke-linecap="round">
    <path d="M141 106 C133 138 88 152 48 133" stroke="#3a332c" stroke-width="19"/>
    <path d="M141 106 C133 138 88 152 48 133" stroke="#b9b4ad" stroke-width="14.5"/>
    <path d="M33 126 C55 148 97 150 119 133" stroke="#3a332c" stroke-width="17"/>
    <path d="M33 126 C55 148 97 150 119 133" stroke="#c0894f" stroke-width="12.5"/>
  </g>

  <!-- Les yeux fermés, tout en courbes -->
  <g fill="none" stroke="#3a332c" stroke-width="2.6" stroke-linecap="round">
    <path d="M80 50 q7 -7 14 0"/>
    <path d="M110 48 q7 -7 14 0"/>
    <path d="M65 97 q6.5 -6.5 13 0"/>
    <path d="M93 95 q6.5 -6.5 13 0"/>
  </g>

  <!-- Les museaux -->
  <path d="M96 62 q10 0 10 8 q0 8 -10 8 q-10 0 -10 -8 q0 -8 10 -8 Z" fill="#f0b48a" stroke="#3a332c" stroke-width="2.2"/>
  <ellipse cx="81" cy="109" rx="7.5" ry="6" fill="#3a332c"/>
  <g fill="none" stroke="#3a332c" stroke-width="2" stroke-linecap="round">
    <path d="M96 78 q0 4 -5 5 M96 78 q0 4 5 5"/>
    <path d="M81 115 q0 4 -4.5 5 M81 115 q0 4 4.5 5"/>
  </g>

  <!-- Le petit cœur du dépliant -->
  <path d="M166 24 C160 15 147 17 147 28 C147 38 162 46 166 50 C170 46 185 38 185 28 C185 17 172 15 166 24 Z"
        fill="#b478e8" opacity="0.85"/>
</svg>
