<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Une rose : la masse de la fleur, puis les pétales enroulés -->
    <g id="rose">
      <circle cx="0" cy="0" r="34" fill="#c9a9f2" opacity="0.55"/>
      <path d="M-34 -6 C-30 -30 -8 -38 6 -30 C22 -36 38 -22 34 -4 C40 14 26 32 8 32 C-8 40 -28 28 -30 12 Z"
            fill="#b78ceb" opacity="0.62"/>
      <path d="M-22 -10 C-18 -24 -4 -28 6 -22 C18 -26 28 -16 25 -4 C29 8 20 20 8 19 C-3 24 -17 16 -18 5 Z"
            fill="#a274e3" opacity="0.55"/>
      <g fill="none" stroke="#7b4bc4" stroke-width="2.4" stroke-linecap="round" opacity="0.72">
        <path d="M0 -9 a9 9 0 1 1 -8.9 10"/>
        <path d="M2 -19 a19 19 0 1 1 -18.8 21"/>
        <path d="M4 -29 a29 29 0 1 1 -28.7 32"/>
      </g>
    </g>
    <!-- Une feuille -->
    <g id="feuille">
      <path d="M0 0 C16 -10 34 -6 42 6 C30 20 12 20 0 0 Z" fill="#b491e8" opacity="0.6"/>
      <path d="M0 0 C14 2 28 5 40 6" fill="none" stroke="#7b4bc4" stroke-width="1.4" opacity="0.6"/>
    </g>
    <!-- Un bouton -->
    <g id="bouton">
      <path d="M0 0 C10 -8 20 -2 18 8 C16 18 4 20 -2 12 Z" fill="#c9a9f2" opacity="0.7"/>
      <path d="M2 4 C8 0 13 2 13 7" fill="none" stroke="#7b4bc4" stroke-width="1.3" opacity="0.6"/>
    </g>
  </defs>

  <g opacity="0.95">
    <use href="#feuille" transform="translate(18 96) rotate(38) scale(1.15)"/>
    <use href="#feuille" transform="translate(96 22) rotate(-16) scale(1)"/>
    <use href="#feuille" transform="translate(112 78) rotate(28) scale(0.85)"/>
    <use href="#feuille" transform="translate(26 32) rotate(150) scale(0.9)"/>
    <use href="#bouton"  transform="translate(120 46) rotate(20) scale(1.1)"/>
    <use href="#bouton"  transform="translate(44 120) rotate(-40) scale(0.9)"/>
    <use href="#rose"    transform="translate(58 54) scale(1.05)"/>
    <use href="#rose"    transform="translate(104 108) scale(0.72)"/>
    <use href="#rose"    transform="translate(20 116) scale(0.5)"/>
    <g fill="#a274e3" opacity="0.5">
      <circle cx="140" cy="20" r="2.4"/><circle cx="152" cy="40" r="1.8"/>
      <circle cx="132" cy="132" r="2.2"/><circle cx="16" cy="150" r="2"/>
    </g>
  </g>
</svg>
